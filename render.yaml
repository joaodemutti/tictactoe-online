services:
  - type: web
    name: tictactoe-online
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tictactoe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: tictactoe-db
    databaseName: tictactoe
    user: tictactoe
    plan: free
