<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ _('btn_login') }} — {{ _('page_title') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const LANG = {{ lang | tojson }};
        const I18N = {{ i18n | tojson }};
        function t(key, vars) {
            let s = I18N[key] !== undefined ? I18N[key] : key;
            if (vars) for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(v);
            return s;
        }
        async function setLang(lang) {
            await fetch('/language', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lang }),
            });
            location.reload();
        }
    </script>
    <style>input, textarea, select { font-size: 16px !important; }</style>
</head>
<body class="bg-gray-950 flex items-center justify-center" style="min-height:100dvh;overflow-x:hidden">
    <div class="w-full max-w-sm px-4">
        <div class="flex justify-end mb-3 gap-1">
            <button onclick="setLang('en')"
                    class="px-2 py-0.5 rounded text-xs font-semibold transition-colors
                           {% if lang == 'en' %}bg-indigo-600 text-white{% else %}text-gray-500 hover:text-white{% endif %}">
                EN
            </button>
            <button onclick="setLang('pt-BR')"
                    class="px-2 py-0.5 rounded text-xs font-semibold transition-colors
                           {% if lang == 'pt-BR' %}bg-indigo-600 text-white{% else %}text-gray-500 hover:text-white{% endif %}">
                PT-BR
            </button>
        </div>
        <h1 class="text-3xl font-bold text-white text-center mb-8">{{ _('page_title') }}</h1>
        <form method="post" action="/login" class="bg-gray-900 rounded-2xl p-8 space-y-5">
            {% if error %}
            <p class="text-red-400 text-sm text-center">{{ error }}</p>
            {% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">{{ _('label_username') }}</label>
                <input type="text" name="username" required autocomplete="username"
                    class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">{{ _('label_password') }}</label>
                <input type="password" name="password" required autocomplete="current-password"
                    class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit"
                class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition-colors">
                {{ _('btn_login') }}
            </button>
            <p class="text-center text-sm text-gray-500">
                {{ _('link_no_account') }} <a href="/signup" class="text-indigo-400 hover:text-indigo-300">{{ _('link_sign_up') }}</a>
            </p>
        </form>
    </div>
</body>
</html>
