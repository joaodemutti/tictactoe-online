<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Tic-Tac-Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 flex items-center justify-center">
    <div class="w-full max-w-sm px-4">
        <h1 class="text-3xl font-bold text-white text-center mb-8">Tic-Tac-Toe</h1>
        <form method="post" action="/login" class="bg-gray-900 rounded-2xl p-8 space-y-5">
            {% if error %}
            <p class="text-red-400 text-sm text-center">{{ error }}</p>
            {% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                <input type="text" name="username" required autocomplete="username"
                    class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required autocomplete="current-password"
                    class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit"
                class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition-colors">
                Log in
            </button>
            <p class="text-center text-sm text-gray-500">
                No account? <a href="/signup" class="text-indigo-400 hover:text-indigo-300">Sign up</a>
            </p>
        </form>
    </div>
</body>
</html>
